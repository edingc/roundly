<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Track your golf rounds, courses, and stats." />
    <!-- Matches the theme so the mobile browser chrome follows light/dark. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
    <title>Roundly - Your Sounds. Your Stats.</title>
    <script>
      // Apply the stored theme before first paint so a dark-mode user never sees
      // a white flash. Kept inline and dependency-free for that reason.
      ;(function () {
        try {
          var stored = localStorage.getItem('roundly.theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          if (stored === 'dark' || (stored !== 'light' && prefersDark)) {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {
          /* private browsing can throw on localStorage; the default theme is fine */
        }
      })()
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
