services:
  roundly:
    build: .
    image: roundly:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ENV: production
      ADDR: ":8080"
      DATABASE_URL: /data/roundly.db
      # Required. Generate with: openssl rand -hex 32
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # The URL the browser uses to reach this instance.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
      # Optional: leave unset to run password-only.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-}
    volumes:
      # Named volume rather than a bind mount: SQLite's locking is unreliable
      # over some bind-mounted filesystems.
      - roundly-data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  roundly-data:
